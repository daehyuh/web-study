spring.application.name=spring_project1

# ======================
# ? H2 ???? ?????? ??
# ======================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# H2 ?? ??? (localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.h2.console.path=/h2-console

# ======================
# ? MyBatis ??
# ======================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.canesblack.spring_project1.domain

# ======================
# ? JSP View Resolver
# ======================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ======================
# ? Swagger / SpringDoc
# ======================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true